[package]
name = "dex-gui"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Native GUI client for the dex daemon, built on Rune"
license = "MIT OR Apache-2.0"
publish = false

# Rune is pre-release and pulls a large GPU/windowing tree: this crate is a workspace member
# but not a default member, and the root `dex` package links it only behind its `gui` feature.

[dependencies]
dex-client = { path = "../dex-client" }
dex-server = { path = "../dex-server" }
rune = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "781e2b6d87cd5f32d6f4365956fad4baaf24ee50" }
# Same 0.12 the Rune tree pins; used to probe installed fonts' charmaps for icon coverage.
# fontconfig is loaded at runtime (dlopen) so builds need no fontconfig headers/pkg-config.
fontique = { version = "0.12", default-features = false, features = ["system", "fontconfig-dlopen"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
# The Terminal tab's PTY (openpty, ioctl, read/write) on Unix; no Windows ConPTY yet —
# there the tab keeps its one-shot command runner.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
