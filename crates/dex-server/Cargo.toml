[package]
name = "dex-server"
version = "0.1.0"
edition = "2021"
description = "Dex server side: daemon (axum + SSE), agent turn engine, provider clients, tools, MCP, Lua extensions, sessions, and headless rendering — everything behind the HTTP+SSE API."
license = "MIT OR Apache-2.0"

[features]
# `tui` gates the terminal-rendering pieces of `render` (ratatui-styled
# markdown/theme helpers). The server core builds without it; the `dex`
# thin client enables it so its TUI can reuse `dex_server::render`.
tui = [
    "dep:ratatui",
    "dep:ratatui-markdown",
]
network-tests = []

[dependencies]
dex-runtime = { version = "0.1.0", path = "../dex-runtime" }
dex-protocol = { version = "0.1.0", path = "../dex-protocol" }
dex-ai = { version = "0.1.0", path = "../dex-ai" }
dex-agent-core = { version = "0.1.0", path = "../dex-agent-core" }
dex-coding-agent = { version = "0.1.0", path = "../dex-coding-agent" }
dex-skills = { version = "0.1.0", path = "../dex-skills" }
dex-session = { version = "0.1.0", path = "../dex-session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# http2: chatgpt/codex negotiates h2 (curl + codex CLI do); without it dex
# forces h1 and gets a transport reset while they succeed. system-proxy:
# macOS Settings proxy that curl/codex honor; dex did not, so direct
# connect failed behind it while they worked. socks: SOCKS proxies
# (127.0.0.1:8081-style) that curl supports; without it dex ignores the
# env proxy and tries direct connect.
  reqwest = { version = "0.13", default-features = false, features = [
      "json",
      "stream",
      "rustls",
      "http2",
      "system-proxy",
      "socks",
  ] }
chrono = "0.4"
ratatui = { version = "0.29", optional = true }
ratatui-markdown = { version = "0.3.6", optional = true, default-features = false, features = [
    "markdown",
    "highlight-lang-bash",
    "highlight-lang-c",
    "highlight-lang-cpp",
    "highlight-lang-go",
    "highlight-lang-java",
    "highlight-lang-javascript",
    "highlight-lang-json",
    "highlight-lang-python",
    "highlight-lang-rust",
    "highlight-lang-typescript",
    "highlight-lang-toml",
    "highlight-lang-yaml",
    "highlight-lang-c-sharp",
    "highlight-lang-css",
    "highlight-lang-dart",
    # No highlight-lang-sql: tree-sitter-sequel 0.3.2 pins cc ~1.0.90,
    # which conflicts with blake3's cc ^1.1.12 (single lockfile, no
    # single cc satisfies both). sql stays on the generic lexer.
    "highlight-lang-html",
    # No highlight-lang-kotlin: ratatui-markdown 0.3.6's KOTLIN_HIGHLIGHTS
    # query still references `(multiline_comment)`, renamed to
    # `(block_comment)` in tree-sitter-kotlin-ng 1.1, so enabling the
    # feature panics on any kotlin block. Re-add once upstream fixes it.
    "highlight-lang-lua",
    "highlight-lang-nix",
    "highlight-lang-php",
    "highlight-lang-ruby",
    "highlight-lang-scala",
    "highlight-lang-swift",
    "highlight-lang-xml",
] }
unicode-width = "0.2"
similar = "3"
terminal-colorsaurus = "1.0.3"

# Client-server architecture
axum = "0.8"
  tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "process", "time", "io-util", "signal"] }
futures-core = "0.3"
uuid = { version = "1", features = ["v4"] }
fff = { package = "fff-search", version = "0.10.6", features = ["definitions"] }
# MCP OAuth login (PKCE S256 + base64url): tiny, audited, std-only otherwise.
base64 = "0.23"
sha2 = "0.11"
# Lua extension runtime: sandboxed scripting VM for harness extensions
# (Lua extensions plan, removed from the repo). Vendored: no system lua dependency.
# lua54: battle-tested over lua55 (plan §13.2). async: host capabilities
# awaited from Lua (P1+ hooks). No `send`: each VM is pinned to its own
# worker thread (engine.rs), so Lua values never cross threads.
mlua = { version = "0.12", features = ["lua54", "vendored", "async"] }

[dev-dependencies]
dex-client = { version = "0.1.0", path = "../dex-client" }
http = "1"
