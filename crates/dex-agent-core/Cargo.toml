[package]
name = "dex-agent-core"
version = "0.1.0"
edition = "2021"
description = "Reusable agent turn engine, policies, and context accounting for dex"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sumofbytes/dex"

[dependencies]
dex-ai = { version = "0.1.0", path = "../dex-ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync", "time"] }
