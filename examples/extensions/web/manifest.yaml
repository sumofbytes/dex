manifest_version: 1
id: web
version: 0.1.0
capabilities: [tools, tools.override, model, net, net.providers]
tools:
    - name: search
      description: Search the web with provider-native search APIs — the current model's family, or the search override model set with /search-model — and return cited results. Requires a Gemini, OpenAI-Responses, or Anthropic-Messages target; unavailable otherwise.
      parameters:
        type: object
        properties:
          query:
            type: string
            description: The search query.
          count:
            type: integer
            description: Max sources to list (default 5).
        required: [query]
      timeout: 120
    - name: fetch
      description: Fetch and summarize the given URLs via Gemini's url_context tool — served by the current Gemini model, or the Gemini override model set with /search-model.
      parameters:
        type: object
        properties:
          urls:
            type: array
            items:
              type: string
            description: URLs to retrieve.
          query:
            type: string
            description: Optional question to answer from the pages.
        required: [urls]
      timeout: 120
