# dex provider samples — copy ONE block into your config file
# (`$XDG_CONFIG_HOME/dex/config.yaml`, i.e. `~/.config/dex/config.yaml`,
# or wherever `$DEX_CONFIG` points), then run `dex doctor` to verify.
#
# Rules that apply to every block:
# - `model:` is the only selection knob: `<provider>/<model-id>`.
# - The key resolves per provider: `providers.<name>.api_key` in the file,
#   else the provider's documented env var (works with an empty file entry
#   or no entry at all — the env var alone is enough when the endpoint is
#   known, see below).
# - Endpoint comes from the models.dev catalog (`dex update --models`
#   refreshes it). Providers with NO catalog endpoint need an explicit
#   `base_url:` in their entry: openai, google (gemini), and any custom
#   gateway missing from the catalog.
# - Model ids rotate: `dex update --models`, then `/model` in the TUI lists
#   current ids. The ids below were valid when this file was written.

# --- Quickest: OpenCode Zen gateway (endpoint from catalog) ---
providers:
  opencode:
    api_key: sk-... # or export OPENCODE_API_KEY instead
model: opencode/gpt-5-nano

# --- Anthropic, native Messages wire (built in, no endpoint needed) ---
# providers:
#   anthropic:
#     api_key: sk-ant-... # or export ANTHROPIC_API_KEY instead
# model: anthropic/claude-sonnet-4-5

# --- ChatGPT-backed Codex (built in; no api_key — uses the codex login) ---
# Run `codex --login` first (refresh it when the token expires).
# model: openai-codex/gpt-5.6-luna

# --- Gemini via Google's OpenAI-compatible endpoint (base_url required:
# --- the catalog documents the key env but no endpoint) ---
# providers:
#   google:
#     api_key: ... # or export GEMINI_API_KEY (also GOOGLE_API_KEY) instead
#     base_url: https://generativelanguage.googleapis.com/v1beta/openai/
# model: google/gemini-3.1-pro-preview

# --- OpenAI via its OpenAI-compatible endpoint (base_url required) ---
# providers:
#   openai:
#     api_key: sk-... # or export OPENAI_API_KEY instead
#     base_url: https://api.openai.com/v1
# model: openai/gpt-5-nano

# --- DeepSeek (endpoint from catalog) ---
# providers:
#   deepseek:
#     api_key: ... # or export DEEPSEEK_API_KEY instead
# model: deepseek/deepseek-v4-flash

# --- Moonshot / Kimi (endpoint from catalog; the provider name is
# --- `moonshotai`, matching the catalog key) ---
# providers:
#   moonshotai:
#     api_key: ... # or export MOONSHOT_API_KEY instead
# model: moonshotai/kimi-k2.6

# --- OpenRouter (endpoint from catalog; model ids keep their
# --- `vendor/model` shape after the provider prefix) ---
# providers:
#   openrouter:
#     api_key: ... # or export OPENROUTER_API_KEY instead
# model: openrouter/qwen/qwen3-coder-flash

# --- commandcode / any custom OpenAI-compatible gateway (base_url required:
# --- it has no catalog entry, so dex cannot learn the endpoint) ---
# providers:
#   commandcode:
#     api_key: ... # or export the gateway's key env var instead
#     base_url: https://commandcode.example/v1
# model: commandcode/<model-id>
#
# If the custom endpoint speaks the Anthropic Messages API instead of an
# OpenAI-compatible one, pin the wire explicitly:
# providers:
#   gateway:
#     api_key: ...
#     base_url: https://gateway.example/v1
#     api: anthropic-messages
# model: gateway/<model-id>
