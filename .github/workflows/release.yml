name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag must point at a commit whose Cargo.toml already carries the
  # tag's version (the bump lands via a normal PR — develop is protected,
  # so no bot push). This job just resolves that commit for the build
  # jobs, so released binaries report the released version.
  bump:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Bump version to match tag
        id: bump
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if ! printf '%s\n' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: tag '$GITHUB_REF_NAME' is not vX.Y.Z" >&2
            exit 1
          fi
          cur="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$ver" != "$cur" ]; then
            echo "error: tag v$ver does not match Cargo.toml $cur." >&2
            echo "develop is protected: land the version bump via PR, then tag its tip." >&2
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is glibc, not static musl: the GUI loads Vulkan/Wayland/X11
          # at runtime, which a static binary cannot do. 22.04 keeps the glibc
          # floor at 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Build the bump commit, not the tag: the tag's tree still has the
          # old version, so `dex --version` would be stale.
          ref: ${{ needs.bump.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        # `gui`: bare `dex` opens the GUI, `dex tui` the TUI — one binary.
        run: cargo build --release --target ${{ matrix.target }} --features gui
      - name: Smoke test
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/dex"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
      - name: Package
        shell: bash
        run: |
          name="dex-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir dist
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            cp "target/x86_64-pc-windows-msvc/release/dex.exe" dist/
            powershell -NoProfile -Command "Compress-Archive -Path dist/dex.exe -DestinationPath '$name.zip' -Force"
          else
            cp "target/${{ matrix.target }}/release/dex" dist/
            tar -czf "$name.tar.gz" -C dist dex
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dex-${{ matrix.target }}
          path: |
            dex-*.tar.gz
            dex-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Publish release
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes dist/*
