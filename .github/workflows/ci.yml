name: CI
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The GUI (`gui` feature, crates/dex-gui) ships in every release binary but is not a default
  # member, so the main job never compiles it. Check it on all release platforms.
  gui-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-check
      - run: cargo clippy -p dex -p dex-gui --features gui --all-targets -- -D warnings
      - run: cargo test -p dex-gui -p dex --features gui --lib --bins --tests
        if: runner.os == 'Linux'

  # Portability gate: catches unix-only APIs before they reach a release tag
  # (v0.1.0 failed exactly this way). windows-latest has MSVC preinstalled —
  # same platform release.yml builds on, no cross-compilation needed.
  windows-check:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-check
      - run: cargo build --all-targets
