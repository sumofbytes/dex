[package]
name = "dex"
version = "0.15.0"
edition = "2021"
description = "Terminal coding agent in Rust: OpenAI-compatible LLMs with tool use (read/bash/write/edit/grep), a ratatui TUI, client-daemon over HTTP+SSE, and JSONL sessions."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/sumofbytes/dex"
authors = ["Arpit Kumar <4772479+arpitsr@users.noreply.github.com>"]
keywords = ["cli", "agent", "llm", "tui", "coding-assistant"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
members = [".", "crates/dex-runtime", "crates/dex-server", "crates/dex-protocol", "crates/dex-ai", "crates/dex-agent-core", "crates/dex-coding-agent", "crates/dex-client", "crates/dex-skills", "crates/dex-session"]
default-members = [".", "crates/dex-runtime", "crates/dex-server", "crates/dex-protocol", "crates/dex-ai", "crates/dex-agent-core", "crates/dex-coding-agent", "crates/dex-client", "crates/dex-skills", "crates/dex-session"]
resolver = "2"

[features]
# `tui` owns every terminal-UI dependency (ratatui, crossterm,
# ratatui-markdown/tree-sitter highlighters). The daemon + client library
# build without it: `cargo build --no-default-features` produces a headless
# binary/library that never links the TUI stack, so an embedder can ship
# their own UI against `dex::client` + `dex_server::daemon` with a much
# smaller dependency tree.
default = ["tui"]
tui = [
    "dex-server/tui",
    "dep:ratatui",
    "dep:crossterm",
    "dep:ratatui-markdown",
]
network-tests = []

[dependencies]
dex-server = { version = "0.1.0", path = "crates/dex-server" }
dex-runtime = { version = "0.1.0", path = "crates/dex-runtime" }
dex-client = { version = "0.1.0", path = "crates/dex-client" }
dex-skills = { version = "0.1.0", path = "crates/dex-skills" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
ratatui-markdown = { version = "0.3.6", optional = true, default-features = false, features = [
    "markdown",
    "highlight-lang-bash",
    "highlight-lang-c",
    "highlight-lang-cpp",
    "highlight-lang-go",
    "highlight-lang-java",
    "highlight-lang-javascript",
    "highlight-lang-json",
    "highlight-lang-python",
    "highlight-lang-rust",
    "highlight-lang-typescript",
    "highlight-lang-toml",
    "highlight-lang-yaml",
    "highlight-lang-c-sharp",
    "highlight-lang-css",
    "highlight-lang-dart",
    # No highlight-lang-sql: tree-sitter-sequel 0.3.2 pins cc ~1.0.90,
    # which conflicts with blake3's cc ^1.1.12 (single lockfile, no
    # single cc satisfies both). sql stays on the generic lexer.
    "highlight-lang-html",
    # No highlight-lang-kotlin: ratatui-markdown 0.3.6's KOTLIN_HIGHLIGHTS
    # query still references `(multiline_comment)`, renamed to
    # `(block_comment)` in tree-sitter-kotlin-ng 1.1, so enabling the
    # feature panics on any kotlin block. Re-add once upstream fixes it.
    "highlight-lang-lua",
    "highlight-lang-nix",
    "highlight-lang-php",
    "highlight-lang-ruby",
    "highlight-lang-scala",
    "highlight-lang-swift",
    "highlight-lang-xml",
] }
unicode-width = "0.2"

# Client-server architecture
  tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "process", "time", "io-util", "signal"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"

# Symbols for profilers (parca-agent / perf / heaptrack) without touching
# release output: RUSTFLAGS="-C force-frame-pointers=yes" cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = true
strip = false
